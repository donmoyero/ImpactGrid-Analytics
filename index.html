<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ImpactGrid Analytical Tool</title>
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="header">
    <h1>ImpactGrid</h1>
    <p>Professional Business Intelligence Dashboard</p>
</header>

<section class="card">
    <h2>Create / Select Business</h2>
    <input type="text" id="businessName" placeholder="Enter Business Name">
    <button onclick="createBusiness()">Create Business</button>
    <select id="businessSelector" onchange="loadBusiness()"></select>
</section>

<section class="card">
    <h2>Add Monthly Business Data</h2>
    <div class="grid">
        <input type="month" id="month">
        <input type="number" id="revenue" placeholder="Revenue">
        <input type="number" id="expenses" placeholder="Operational Expenses">
        <input type="number" id="fixedCosts" placeholder="Fixed Costs">
        <input type="number" id="customers" placeholder="Customers">
        <input type="number" id="marketing" placeholder="Marketing Spend">
        <button onclick="addData()">Add Month</button>
    </div>
</section>

<section class="card">
    <h2>Executive KPIs</h2>
    <div id="kpis" class="kpi-grid"></div>
</section>

<section class="card">
    <h2>Performance Charts</h2>

    <h3>Revenue vs Profit</h3>
    <canvas id="revenueProfitChart"></canvas>

    <h3>Expense Structure</h3>
    <canvas id="expenseChart"></canvas>

    <h3>Profit Margin Trend (%)</h3>
    <canvas id="marginChart"></canvas>

    <h3>Customer Growth</h3>
    <canvas id="customerChart"></canvas>

    <h3>Customer Acquisition Cost (CAC)</h3>
    <canvas id="cacChart"></canvas>
</section>

<script src="script.js"></script>

</body>
</html>
