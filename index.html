<!DOCTYPE html>
<html>
<head>
    <title>ImpactGrid Analytical Tool</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
    <h1>ImpactGrid Analytical Tool</h1>
    <p>Business Intelligence & Performance Dashboard</p>
</header>

<section class="card">
    <h2>Enter Monthly Business Data</h2>

    <div class="grid">
        <input type="month" id="month">
        <input type="number" id="revenue" placeholder="Total Revenue">
        <input type="number" id="expenses" placeholder="Total Expenses">
        <input type="number" id="customers" placeholder="Total Customers">
        <input type="number" id="marketing" placeholder="Marketing Spend">
        <button onclick="addData()">Add Data</button>
    </div>
</section>

<section class="card">
    <h2>Key Performance Indicators</h2>
    <div id="kpiContainer" class="kpi-grid"></div>
</section>

<section class="card">
    <h2>Business Insights</h2>
    <div id="insights"></div>
</section>

<section class="card">
    <h2>Performance Visualizations</h2>
    <canvas id="revenueChart"></canvas>
    <canvas id="profitChart"></canvas>
    <canvas id="expenseChart"></canvas>
</section>

<script src="script.js"></script>
</body>
</html>
