<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impactgrid Analytical Tool</title>

<link rel="stylesheet" href="style.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<header>
  <h1>Impactgrid Analytical Tool</h1>
  <p>Professional Business Intelligence Dashboard</p>
</header>

<div class="container">

  <div class="sidebar">
    <h2>Add Monthly Data</h2>

    <input id="month" placeholder="Month (e.g. Jan)">
    <input id="revenue" type="number" placeholder="Revenue">
    <input id="costs" type="number" placeholder="Costs">
    <input id="marketing" type="number" placeholder="Marketing Spend">
    <input id="customers" type="number" placeholder="Customers">

    <button id="addBtn">Add Data</button>
    <button id="analyzeBtn">Run Analysis</button>
  </div>

  <div class="main">
    <div class="kpis">
      <div class="card">
        <h3>Total Revenue</h3>
        <p id="totalRevenue">$0</p>
      </div>
      <div class="card">
        <h3>Total Profit</h3>
        <p id="totalProfit">$0</p>
      </div>
      <div class="card">
        <h3>Growth</h3>
        <p id="growth">$0%</p>
      </div>
      <div class="card">
        <h3>CAC</h3>
        <p id="cac">$0</p>
      </div>
    </div>

    <canvas id="revenueChart"></canvas>
    <canvas id="profitChart"></canvas>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
