<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ImpactGrid - Business Intelligence</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
    <h1>ImpactGrid</h1>
    <p>Professional Business Analytics Engine</p>
</header>

<section class="card">
    <h2>Create Business</h2>
    <input type="text" id="businessName" placeholder="Business Name">
    <button id="createBtn">Create & Select</button>
    <select id="businessSelector"></select>
</section>

<section class="card">
    <h2>Add Monthly Data</h2>
    <div class="grid">
        <input type="month" id="month">
        <input type="number" id="revenue" placeholder="Revenue">
        <input type="number" id="expenses" placeholder="Expenses">
        <input type="number" id="fixedCosts" placeholder="Fixed Costs">
        <input type="number" id="customers" placeholder="Customers">
        <input type="number" id="marketing" placeholder="Marketing Spend">
        <button id="addBtn">Add Month</button>
    </div>
</section>

<section class="card">
    <h2>Executive KPIs</h2>
    <div id="kpis" class="kpi-grid"></div>
</section>

<section class="card">
    <h2>Performance Analytics</h2>
    <canvas id="chartRevenueProfit"></canvas>
    <canvas id="chartExpenses"></canvas>
    <canvas id="chartMargin"></canvas>
    <canvas id="chartCustomers"></canvas>
    <canvas id="chartCAC"></canvas>
</section>

<script src="script.js"></script>
</body>
</html>
