<!DOCTYPE html>
<html>
<head>
    <title>Donmoyero Analytics</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <h1>Donmoyero Analytical Tool</h1>

    <!-- Data Upload Section -->
    <section class="card">
        <h2>Upload CSV Data</h2>
        <input type="file" id="fileInput" accept=".csv">
    </section>

    <!-- Data Summary -->
    <section class="card">
        <h2>Data Summary</h2>
        <div id="summary"></div>
    </section>

    <!-- Filter Section -->
    <section class="card">
        <h2>Filter Data</h2>
        <select id="filterColumn"></select>
        <input type="text" id="filterValue" placeholder="Enter value">
        <button onclick="applyFilter()">Apply Filter</button>
    </section>

    <!-- Aggregation Section -->
    <section class="card">
        <h2>Aggregation</h2>
        <select id="groupColumn"></select>
        <select id="aggColumn"></select>
        <select id="aggFunction">
            <option value="sum">Sum</option>
            <option value="avg">Average</option>
            <option value="count">Count</option>
        </select>
        <button onclick="aggregateData()">Run</button>
    </section>

    <!-- Chart Section -->
    <section class="card">
        <h2>Visualization</h2>
        <canvas id="chartCanvas"></canvas>
    </section>

    <script src="script.js"></script>
</body>
</html>
