<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impactgrid Analytical Tool</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  <h1>Impactgrid Analytical Tool</h1>
  <p>Professional Business Intelligence Dashboard</p>
</header>

<div class="container">

  <div class="sidebar">
    <h2>Enter Monthly Business Data</h2>

    <label>Month</label>
    <input type="text" id="month" placeholder="January">

    <label>Revenue ($)</label>
    <input type="number" id="revenue">

    <label>Costs ($)</label>
    <input type="number" id="costs">

    <label>Marketing Spend ($)</label>
    <input type="number" id="marketing">

    <label>Customers Acquired</label>
    <input type="number" id="customers">

    <button id="addData">Add Data</button>
    <button id="runAnalysis">Run Analysis</button>
  </div>

  <div class="main">

    <div class="kpis">
      <div class="card">
        <h3>Total Revenue</h3>
        <p id="totalRevenue">$0</p>
      </div>

      <div class="card">
        <h3>Total Profit</h3>
        <p id="totalProfit">$0</p>
      </div>

      <div class="card">
        <h3>Revenue Growth</h3>
        <p id="growthRate">0%</p>
      </div>

      <div class="card">
        <h3>Customer Acquisition Cost</h3>
        <p id="cac">$0</p>
      </div>
    </div>

    <div class="charts">
      <canvas id="revenueChart"></canvas>
      <canvas id="profitChart"></canvas>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
