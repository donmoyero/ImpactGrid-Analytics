<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ImpactGrid SaaS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf"></script>
</head>
<body>

<header class="header">
    <h1>ImpactGrid</h1>
    <p>Enterprise Business Intelligence</p>
</header>

<section class="card">
    <h2>Create / Select Business</h2>
    <input type="text" id="businessName" placeholder="Enter Business Name">
    <button onclick="createBusiness()">Create Business</button>
    <select id="businessSelector" onchange="loadBusiness()"></select>
</section>

<section class="card">
    <h2>Add Monthly Data</h2>
    <div class="grid">
        <input type="month" id="month">
        <input type="number" id="revenue" placeholder="Revenue">
        <input type="number" id="expenses" placeholder="Expenses">
        <input type="number" id="fixedCosts" placeholder="Fixed Costs">
        <input type="number" id="customers" placeholder="Customers">
        <input type="number" id="marketing" placeholder="Marketing Spend">
        <button onclick="addData()">Add Month</button>
    </div>
</section>

<section class="card">
    <h2>Executive KPIs</h2>
    <div id="kpis" class="kpi-grid"></div>
</section>

<section class="card">
    <h2>Insights</h2>
    <div id="insights"></div>
    <button onclick="exportPDF()">Download Executive Report</button>
</section>

<section class="card">
    <h2>Performance Charts</h2>
    <canvas id="revenueChart"></canvas>
    <canvas id="profitChart"></canvas>
</section>

<script src="script.js"></script>
</body>
</html>
