<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ImpactGrid Dashboard</title>

<!-- Chart.js (stable CDN) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>ImpactGrid Professional Dashboard</h1>

<section class="card">
<h2>Create Business</h2>
<input type="text" id="businessName" placeholder="Business Name">
<button onclick="createBusiness()">Create</button>
<select id="businessSelector" onchange="loadBusiness()"></select>
</section>

<section class="card">
<h2>Add Monthly Data</h2>
<input type="month" id="month">
<input type="number" id="revenue" placeholder="Revenue">
<input type="number" id="expenses" placeholder="Expenses">
<input type="number" id="customers" placeholder="Customers">
<button onclick="addData()">Add</button>
</section>

<section class="card">
<h2>KPIs</h2>
<div id="kpis"></div>
</section>

<section class="card">
<h2>Charts</h2>
<canvas id="revenueChart"></canvas>
<canvas id="profitChart"></canvas>
<canvas id="customerChart"></canvas>
</section>

<script src="script.js"></script>

</body>
</html>
