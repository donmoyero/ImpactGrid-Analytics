<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImpactGrid | SME Financial Stability Modelling Engine</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ImpactGrid - Regime-Dependent Financial Stability Modelling for SMEs.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

    <!-- Supabase CDN (NO defer) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="app" class="app-layout">

<button class="mobile-toggle" onclick="toggleSidebar()">☰</button>

<aside class="sidebar" id="sidebar">
    <div class="logo-container">
        <img src="logo.png" alt="ImpactGrid Logo" class="logo-img">
        <div>
            <span class="logo-text">ImpactGrid</span>
            <div style="font-size:12px; color:#64748b; margin-top:4px; letter-spacing:0.5px;">
                Engine v2
            </div>
        </div>
    </div>

    <nav>
        <ul>
            <li onclick="showSection('dashboard', event)" class="active">Financial Overview</li>
            <li onclick="showSection('forecast', event)">Forecast Horizons</li>
            <li onclick="showSection('matrix', event)">Performance Matrix</li>
            <li onclick="showSection('risk', event)">Risk Assessment</li>
            <li onclick="logout()">Logout</li>
        </ul>
    </nav>
</aside>

<main class="main-content">

<header class="dashboard-header">
    <h1>SME Financial Stability Modelling Engine</h1>
    <p class="engine-subtitle">
        ImpactGrid Financial Stability Regime Model (IFSRM)
    </p>
</header>

<!-- ================= DASHBOARD ================= -->
<section id="dashboard" class="page-section active-section">
    <!-- YOUR ORIGINAL DASHBOARD CONTENT REMAINS UNCHANGED -->
</section>

<!-- FORECAST / MATRIX / RISK SECTIONS REMAIN UNCHANGED -->

<footer class="dashboard-footer">
    © 2026 ImpactGrid Stability Engine
</footer>

</main>
</div>

<script src="./script.js" defer></script>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active-mobile");
}

/* ================= SUPABASE CLIENT ================= */

const supabaseUrl = "https://vopehiqnduxobtaamrnh.supabase.co";
const supabaseAnonKey = "sb_publishable_oPR-GdRq7Rz3RvBepMkVQw_b7R6ocA3";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseAnonKey
);

/* ================= AUTH CONTROL ================= */

window.addEventListener("load", async () => {

    try {
        const { data: { session } } = await supabase.auth.getSession();

        if (!session) {
            window.location.href = "login.html";
            return;
        }

        supabase.auth.onAuthStateChange((event, session) => {
            if (!session) {
                window.location.href = "login.html";
            }
        });

    } catch (err) {
        console.error("Auth error:", err);
        window.location.href = "login.html";
    }

});

/* ================= LOGOUT ================= */

async function logout() {
    await supabase.auth.signOut();
    window.location.href = "login.html";
}
</script>

</body>
</html>
