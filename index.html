<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImpactGrid Analytical Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="dashboard-header">
        <div>
            <h1>ImpactGrid</h1>
            <p>Business Intelligence & Performance Dashboard</p>
        </div>
        <div class="header-actions">
            <button class="btn-secondary" onclick="exportData()">Export CSV</button>
            <button class="btn-primary" onclick="toggleTheme()">Toggle Theme</button>
        </div>
    </header>

    <!-- ================= MAIN LAYOUT ================= -->
    <main class="dashboard-container">

        <!-- ===== INPUT PANEL ===== -->
        <section class="card input-card">
            <h2>Enter Monthly Business Data</h2>

            <div class="grid">
                <input type="month" id="month">
                <input type="number" id="revenue" placeholder="Total Revenue">
                <input type="number" id="expenses" placeholder="Total Expenses">
                <input type="number" id="customers" placeholder="Total Customers">
                <input type="number" id="marketing" placeholder="Marketing Spend">
                <button class="btn-primary" onclick="addData()">Add Data</button>
            </div>
        </section>

        <!-- ===== KPI SECTION ===== -->
        <section class="card">
            <h2>Key Performance Indicators</h2>
            <div id="kpiContainer" class="kpi-grid"></div>
        </section>

        <!-- ===== INSIGHTS SECTION ===== -->
        <section class="card">
            <h2>Business Insights</h2>
            <div id="insights" class="insights-container"></div>
        </section>

        <!-- ===== CHART SECTION ===== -->
        <section class="card">
            <h2>Performance Visualizations</h2>

            <div class="charts-grid">
                <div class="chart-card">
                    <canvas id="revenueChart"></canvas>
                </div>

                <div class="chart-card">
                    <canvas id="profitChart"></canvas>
                </div>

                <div class="chart-card">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <footer class="dashboard-footer">
        <p>© 2026 ImpactGrid Analytics • Professional BI Toolkit</p>
    </footer>

<script src="script.js"></script>
</body>
</html>
