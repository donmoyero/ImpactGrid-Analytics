<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ImpactGrid Analytical Tool</title>
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js MUST load before script.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="header">
    <h1>ImpactGrid</h1>
    <p>Advanced Business Intelligence Platform</p>
</header>

<section class="card">
    <h2>Business Data Entry</h2>
    <div class="grid">
        <input type="month" id="month">
        <input type="number" id="revenue" placeholder="Revenue">
        <input type="number" id="expenses" placeholder="Expenses">
        <input type="number" id="fixedCosts" placeholder="Fixed Costs">
        <input type="number" id="customers" placeholder="Customers">
        <input type="number" id="marketing" placeholder="Marketing Spend">
        <button id="addBtn">Add Month</button>
    </div>
</section>

<section class="card">
    <h2>Executive KPIs</h2>
    <div id="kpis" class="kpi-grid"></div>
</section>

<section class="card">
    <h2>Strategic Insights</h2>
    <div id="insights"></div>
</section>

<section class="card">
    <h2>Revenue & Profit Trends</h2>
    <canvas id="revenueChart"></canvas>
    <canvas id="profitChart"></canvas>
</section>

<section class="card">
    <h2>6-Month Forecast</h2>
    <canvas id="forecastChart"></canvas>
</section>

<script src="script.js"></script>

</body>
</html>
