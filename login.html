<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>ImpactGrid | Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #06080f;
      --surface:  #0e1220;
      --elevated: #121729;
      --border:   #1a2035;
      --mid:      #222b42;
      --gold:     #c8a96e;
      --gold-l:   #e2c98a;
      --gold-g:   rgba(200,169,110,0.10);
      --success:  #2dd4a0;
      --danger:   #ff4d6d;
      --text:     #edf0f7;
      --sec:      #7a8ba8;
      --muted:    #3d4e68;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 15% 10%, rgba(200,169,110,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 90%, rgba(61,127,255,0.05) 0%, transparent 55%);
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    /* Logo */
    .login-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      justify-content: center;
    }
    .login-logo img { height: 42px; width: auto; }
    .login-logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gold), var(--gold-l));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Card */
    .login-card {
      background: var(--surface);
      border: 1px solid var(--mid);
      border-radius: 18px;
      padding: 36px 32px 32px;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-l), transparent);
      opacity: 0.4;
    }

    .login-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }
    .login-subtitle {
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.06em;
      margin-bottom: 28px;
    }

    /* Fields */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--elevated);
      border: 1px solid var(--mid);
      border-radius: 9px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Manrope', sans-serif;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(200,169,110,0.12);
    }
    .field input::placeholder { color: var(--muted); }

    /* Buttons */
    .btn-main {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #b8923e, var(--gold-l));
      color: #06080f;
      font-weight: 700;
      font-size: 14px;
      font-family: 'Manrope', sans-serif;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s, transform 0.15s;
      letter-spacing: 0.02em;
    }
    .btn-main:hover { opacity: 0.92; transform: translateY(-1px); }

    .btn-google {
      width: 100%;
      padding: 12px;
      background: var(--elevated);
      border: 1px solid var(--mid);
      border-radius: 9px;
      color: var(--sec);
      font-size: 13px;
      font-family: 'Manrope', sans-serif;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-google:hover { border-color: var(--gold); color: var(--gold-l); }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .divider span {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* Toggle */
    .toggle-auth {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--sec);
    }
    .toggle-auth span {
      color: var(--gold);
      cursor: pointer;
      font-weight: 600;
      transition: color 0.15s;
    }
    .toggle-auth span:hover { color: var(--gold-l); }

    /* Error / Success */
    #errorMessage {
      margin-top: 14px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      padding: 10px 13px;
      border-radius: 7px;
      display: none;
    }
    #errorMessage.error  { background: rgba(255,77,109,0.08); border: 1px solid rgba(255,77,109,0.25); color: var(--danger); }
    #errorMessage.success{ background: rgba(45,212,160,0.08); border: 1px solid rgba(45,212,160,0.25); color: var(--success); }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

<div class="login-wrap">

  <div class="login-logo">
    <img src="logo.png" alt="ImpactGrid">
    <span class="login-logo-text">ImpactGrid</span>
  </div>

  <div class="login-card">

    <div class="login-title" id="formTitle">Welcome back</div>
    <div class="login-subtitle">SME Financial Stability Platform · IFSRM v3.0</div>

    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') handleAuth()">
    </div>

    <button class="btn-main" id="authButton" onclick="handleAuth()">Sign In</button>

    <div class="divider"><span>or</span></div>

    <button class="btn-google" onclick="handleGoogle()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div id="errorMessage"></div>

    <div class="toggle-auth">
      <span id="toggleText">Don't have an account?</span>
      &nbsp;<span onclick="toggleMode()" id="toggleLink">Create one</span>
    </div>

  </div>

  <div class="login-footer">© 2026 ImpactGrid Analytics · impactgridanalytics.com</div>

</div>

<script>
  var isLogin = true;

  /* ── Session check ── */
  (async function() {
    try {
      var s = await window.supabaseClient.auth.getSession();
      if (s.data && s.data.session) window.location.href = "index.html";
    } catch(e) {}
  })();

  /* ── Toggle mode ── */
  function toggleMode() {
    isLogin = !isLogin;
    document.getElementById("formTitle").textContent   = isLogin ? "Welcome back" : "Create account";
    document.getElementById("authButton").textContent  = isLogin ? "Sign In" : "Sign Up";
    document.getElementById("toggleText").textContent  = isLogin ? "Don't have an account?" : "Already have an account?";
    document.getElementById("toggleLink").textContent  = isLogin ? "Create one" : "Sign in";
    showMsg("", "");
  }

  /* ── Auth handler ── */
  async function handleAuth() {
    var email    = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;

    if (!email || !password) { showMsg("Please enter your email and password.", "error"); return; }

    var btn = document.getElementById("authButton");
    btn.textContent = "Please wait...";
    btn.style.opacity = "0.7";

    try {
      var result = isLogin
        ? await window.supabaseClient.auth.signInWithPassword({ email, password })
        : await window.supabaseClient.auth.signUp({ email, password });

      if (result.error) {
        showMsg(result.error.message, "error");
      } else if (!isLogin) {
        showMsg("Account created! Check your email to confirm, then sign in.", "success");
      } else {
        window.location.href = "index.html";
      }
    } catch(e) {
      showMsg("Something went wrong. Please try again.", "error");
    }

    btn.textContent = isLogin ? "Sign In" : "Sign Up";
    btn.style.opacity = "1";
  }

  /* ── Google ── */
  async function handleGoogle() {
    try {
      await window.supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + "/index.html" }
      });
    } catch(e) {
      showMsg("Google sign-in failed. Please try again.", "error");
    }
  }

  /* ── Message helper ── */
  function showMsg(text, type) {
    var el = document.getElementById("errorMessage");
    el.className = type;
    el.textContent = text;
    el.style.display = text ? "block" : "none";
  }
</script>

</body>
</html>
