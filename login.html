<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ImpactGrid | Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-97XD9941FC"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-97XD9941FC');</script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    :root{
      --bg:#f0f2f8;--surface:#ffffff;--border:#e2e5f0;--border-mid:#cdd2e8;
      --text:#08102a;--text2:#3e4f72;--muted:#8898b8;
      --gold:#a07828;--gold-l:#c49a3a;--gold-pale:#fdf6e3;
      --blue:#1847c4;--success:#0a7c5c;--danger:#c41830;--ink:#08102a;
      --sh:0 4px 24px rgba(8,16,42,0.10),0 1px 4px rgba(8,16,42,0.06);
      --sh-lg:0 16px 48px rgba(8,16,42,0.13),0 4px 12px rgba(8,16,42,0.07);
    }
    body.dark-mode{
      --bg:#05070f;--surface:#0d1020;--border:#1a2038;--border-mid:#243050;
      --text:#eef2ff;--text2:#8898c0;--muted:#3a4a70;
      --gold:#c49a3a;--gold-l:#e0b84a;--gold-pale:rgba(196,154,58,0.09);
      --blue:#4a80ff;--success:#0ecf9c;--danger:#f03050;--ink:#eef2ff;
      --sh:0 4px 24px rgba(0,0,0,0.45);
      --sh-lg:0 16px 48px rgba(0,0,0,0.60);
    }
    body{
      font-family:'Plus Jakarta Sans',sans-serif;
      background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;
    }
    body::before{
      content:'';position:fixed;inset:0;
      background-image:radial-gradient(circle at 1px 1px,var(--border) 1px,transparent 0);
      background-size:28px 28px;opacity:.55;pointer-events:none;z-index:0;
    }
    body.dark-mode::before{opacity:.15;}
    body::after{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 55% 45% at 15% 10%,rgba(160,120,40,0.07) 0%,transparent 60%),
        radial-gradient(ellipse 45% 40% at 85% 90%,rgba(24,71,196,0.05) 0%,transparent 60%);
    }
    .theme-btn{
      position:fixed;top:16px;right:16px;z-index:100;
      width:38px;height:38px;background:var(--surface);border:1px solid var(--border-mid);
      border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;
      font-size:16px;box-shadow:var(--sh);transition:all .14s;
    }
    .theme-btn:hover{border-color:var(--gold);transform:scale(1.06);}
    .wrap{position:relative;z-index:1;width:100%;max-width:420px;}
    .live-badge{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:16px;}
    .live-dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 2.5s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.65);}}
    .live-text{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);}
    .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:26px;justify-content:center;}
    .logo-row img{width:34px;height:34px;object-fit:contain;}
    .logo-name{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.4px;}
    .logo-name span{color:var(--gold);}
    .logo-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:1px;}
    .card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:20px;padding:32px 28px 26px;box-shadow:var(--sh-lg);
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;top:0;left:10%;right:10%;height:2px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55;
    }
    .tabs{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:20px;gap:3px;}
    .tab{flex:1;padding:8px 10px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .14s;}
    .tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 5px rgba(8,16,42,0.10);}
    body.dark-mode .tab.active{box-shadow:0 1px 6px rgba(0,0,0,.4);}
    .subtitle{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
    .field{margin-bottom:13px;}
    .field label{display:block;font-size:10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.10em;color:var(--muted);font-weight:600;margin-bottom:5px;}
    .field input{
      width:100%;padding:11px 14px;border:1.5px solid var(--border-mid);border-radius:9px;
      background:var(--surface);color:var(--text);font-size:13.5px;
      font-family:'Plus Jakarta Sans',sans-serif;outline:none;
      transition:border-color .14s,box-shadow .14s;
    }
    .field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(160,120,40,0.13);}
    .field input::placeholder{color:var(--muted);}
    body.dark-mode .field input{background:rgba(255,255,255,0.04);}
    .pw-wrap{position:relative;}
    .pw-wrap input{padding-right:42px;}
    .eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:0;display:flex;align-items:center;transition:color .14s;}
    .eye-btn:hover{color:var(--gold);}
    .btn-main{
      width:100%;padding:13px;margin-top:6px;
      background:var(--ink);color:#fff;border:none;border-radius:10px;
      font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;
      cursor:pointer;letter-spacing:.02em;
      transition:opacity .15s,transform .15s,box-shadow .15s;
      box-shadow:0 4px 14px rgba(8,16,42,0.20);
    }
    .btn-main:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 6px 20px rgba(8,16,42,0.25);}
    body.dark-mode .btn-main{background:var(--gold);color:var(--ink);}
    .divider{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
    .btn-google{
      width:100%;padding:11px;background:var(--surface);border:1.5px solid var(--border-mid);
      border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;
      color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
      transition:all .14s;
    }
    .btn-google:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(8,16,42,0.08);}
    #msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:12.5px;line-height:1.5;display:none;}
    #msg.error{background:rgba(196,24,48,0.08);color:var(--danger);border:1px solid rgba(196,24,48,0.22);}
    #msg.success{background:rgba(10,124,92,0.08);color:var(--success);border:1px solid rgba(10,124,92,0.22);}
    .footer{text-align:center;margin-top:20px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.06em;}
  </style>
</head>
<body>

<button class="theme-btn" onclick="toggleDark()" id="themeBtn">🌙</button>

<div class="wrap">
  <div class="live-badge">
    <div class="live-dot"></div>
    <span class="live-text">IFSRM v3.0 &middot; Live Intelligence Platform</span>
  </div>

  <div class="logo-row">
    <img src="logo.png" alt="ImpactGrid">
    <div>
      <div class="logo-name">Impact<span>Grid</span></div>
      <div class="logo-tag">Financial Analytics</div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab" id="tabSignin" onclick="setMode(true)">Sign In</button>
      <button class="tab active" id="tabSignup" onclick="setMode(false)">Create Account</button>
    </div>

    <div class="subtitle" id="subtitle">Create your free account to access the analytics platform.</div>

    <div id="signupExtra">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Your full name" autocomplete="name">
      </div>
      <div class="field">
        <label>Business Name</label>
        <input type="text" id="businessName" placeholder="Your business name">
      </div>
    </div>

    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Min. 8 characters"
          autocomplete="new-password" onkeydown="if(event.key==='Enter')handleAuth()">
        <button type="button" class="eye-btn" onclick="togglePw('password','eye1')" tabindex="-1">
          <svg id="eye1" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field" id="confirmField">
      <label>Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="confirmPassword" placeholder="Re-enter password"
          autocomplete="new-password" onkeydown="if(event.key==='Enter')handleAuth()">
        <button type="button" class="eye-btn" onclick="togglePw('confirmPassword','eye2')" tabindex="-1">
          <svg id="eye2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-main" id="authBtn" onclick="handleAuth()">Create Account</button>

    <div class="divider"><span>or</span></div>

    <button class="btn-google" onclick="handleGoogle()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div id="msg"></div>
  </div>

  <div class="footer">&copy; 2026 ImpactGrid Analytics &middot; impactgridanalytics.com</div>
</div>

<script>
(function(){
  var t = localStorage.getItem('ig-theme');
  if (t === 'dark') { document.body.classList.add('dark-mode'); document.getElementById('themeBtn').textContent = '\u2600\uFE0F'; }
})();

function toggleDark() {
  var dark = document.body.classList.toggle('dark-mode');
  document.getElementById('themeBtn').textContent = dark ? '\u2600\uFE0F' : '\uD83C\uDF19';
  try { localStorage.setItem('ig-theme', dark ? 'dark' : 'light'); } catch(e){}
}

var isLogin = false;

function setMode(login) {
  isLogin = login;
  document.getElementById('tabSignin').classList.toggle('active', login);
  document.getElementById('tabSignup').classList.toggle('active', !login);
  document.getElementById('signupExtra').style.display  = login ? 'none' : 'block';
  document.getElementById('confirmField').style.display = login ? 'none' : 'block';
  document.getElementById('authBtn').textContent = login ? 'Sign In' : 'Create Account';
  document.getElementById('subtitle').textContent = login
    ? 'Welcome back — sign in to your account.'
    : 'Create your free account to access the analytics platform.';
  showMsg('', '');
}

function togglePw(id, iconId) {
  var inp = document.getElementById(id);
  var ico = document.getElementById(iconId);
  if (inp.type === 'password') {
    inp.type = 'text';
    ico.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type = 'password';
    ico.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function showMsg(text, type) {
  var el = document.getElementById('msg');
  el.className = type; el.textContent = text;
  el.style.display = text ? 'block' : 'none';
}

function waitForSupabase(cb, n) {
  n = n || 0;
  if (n > 60) return;
  if (window.supabaseClient) cb();
  else setTimeout(function(){ waitForSupabase(cb, n+1); }, 100);
}

waitForSupabase(async function() {
  try {
    window.supabaseClient.auth.onAuthStateChange(function(e, s) {
      if (e === 'SIGNED_IN' && s) window.location.href = 'index.html';
    });
    var s = await window.supabaseClient.auth.getSession();
    if (s.data && s.data.session) window.location.href = 'index.html';
  } catch(e) { console.error('Session:', e); }
});

async function handleAuth() {
  var email = (document.getElementById('email').value||''). trim();
  var pwd   = document.getElementById('password').value||''
  if (!email || !pwd) { showMsg('Please enter your email and password.', 'error'); return; }
  if (!window.supabaseClient) { showMsg('Auth service not ready — refresh the page.', 'error'); return; }
  var btn = document.getElementById('authBtn');
  btn.textContent = 'Please wait…'; btn.style.opacity = '.65';
  try {
    var result;
    if (isLogin) {
      result = await window.supabaseClient.auth.signInWithPassword({ email:email, password:pwd });
    } else {
      if (pwd.length < 8) { showMsg('Password must be at least 8 characters.', 'error'); btn.textContent='Create Account'; btn.style.opacity='1'; return; }
      var confirm = document.getElementById('confirmPassword').value||'';
      if (pwd !== confirm) { showMsg('Passwords do not match.', 'error'); btn.textContent='Create Account'; btn.style.opacity='1'; return; }
      var meta={};
      var fn=(document.getElementById('fullName').value||''). trim();
      var bn=(document.getElementById('businessName').value||''). trim();
      if(fn) meta.full_name=fn; if(bn) meta.business_name=bn;
      result = await window.supabaseClient.auth.signUp({ email:email, password:pwd, options:{data:meta} });
    }
    if (result.error) {
      var m = result.error.message;
      if (m.includes('already registered')) m='An account with this email already exists. Please sign in.';
      if (m.includes('Invalid login'))       m='Incorrect email or password.';
      if (m.includes('Email not confirmed')) m='Please confirm your email before signing in.';
      showMsg(m, 'error');
    } else if (!isLogin) {
      if (result.data && result.data.user && !result.data.session) {
        showMsg('Account created! Check your email to confirm, then sign in.', 'success');
        setTimeout(function(){ setMode(true); }, 3500);
      } else { window.location.href='index.html'; }
    } else { window.location.href='index.html'; }
  } catch(e) { showMsg('Something went wrong. Please try again.', 'error'); }
  btn.textContent = isLogin ? 'Sign In' : 'Create Account'; btn.style.opacity='1';
}

async function handleGoogle() {
  if (!window.supabaseClient) { showMsg('Auth service not ready.', 'error'); return; }
  var btn = document.querySelector('.btn-google');
  if (btn) { btn.textContent='Connecting…'; btn.style.opacity='.65'; }
  try {
    var r = await window.supabaseClient.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:'https://impactgridanalytics.com' } });
    if (r.error) { showMsg('Google sign-in failed: '+r.error.message, 'error'); if(btn){btn.textContent='Continue with Google';btn.style.opacity='1';} }
  } catch(e) { showMsg('Google sign-in failed.', 'error'); if(btn){btn.textContent='Continue with Google';btn.style.opacity='1';} }
}
</script>
</body>
</html>
