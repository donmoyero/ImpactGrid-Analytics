<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>Confirm your ShopPlug account</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="background:#ffffff;">
  <tr>
    <td align="center" style="padding:48px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td align="center" style="padding-bottom:36px;">
            <img src="https://www.shopplug.uk/images/shopplug-logo.png" alt="ShopPlug" width="190" style="display:block;width:190px;height:auto;border:0;">
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;color:#111111;padding-bottom:14px;">
            Confirm your email
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#444444;padding-bottom:30px;">
            Welcome to ShopPlug. Click the button below to confirm your email address and finish creating your account.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:30px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#111111;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;text-decoration:none;padding:16px 36px;">Confirm email</a>
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#777777;padding-bottom:28px;">
            If you didn&rsquo;t create a ShopPlug account, you can ignore this email.
          </td>
        </tr>
        <tr>
          <td style="border-top:1px solid #eeeeee;padding-top:20px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#999999;" align="center">
            ShopPlug &middot; <a href="mailto:hello@shopplug.uk" style="color:#999999;text-decoration:underline;">hello@shopplug.uk</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
